name: Process from Drive
run-name: ${{ inputs.label || format('Drive {0}', inputs.action) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: "list = check what's in Drive. render = cut a video from Incoming."
        type: choice
        options: ["list", "render"]
        default: "list"
      job:
        description: "For render: the job JSON (see README)"
        required: false
        default: ""
      output_height:
        description: "Output resolution: source keeps it, 1080 renders 1080p (much faster from 4K)"
        type: choice
        options: ["source", "1080"]
        default: "source"
      label:
        description: "Optional: a name for this run (the web app fills this in)"
        required: false
        default: ""

concurrency:
  group: process
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      DESCRIPTION_EXAMPLE: ${{ vars.DESCRIPTION_EXAMPLE }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Python packages
        timeout-minutes: 5
        run: pip install --quiet --retries 3 --timeout 30 requests boto3

      # FFmpeg comes from a cached copy or a ready-made GitHub download, not Ubuntu's
      # package mirrors (which can hang for hours). A stall now fails within 10 minutes.
      - name: Restore cached FFmpeg
        if: inputs.action == 'render'
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-bin
          key: ffmpeg-static-v1-${{ runner.os }}

      - name: Install FFmpeg
        if: inputs.action == 'render'
        timeout-minutes: 10
        run: bash scripts/install-ffmpeg.sh

      # /mnt has far more free space than the default work folder (10 GB sources).
      - name: Prepare work folder
        run: |
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          df -h /mnt | tail -1

      - name: Run
        env:
          JOB: ${{ inputs.job }}
        run: python3 worker/run_job.py "${{ inputs.action }}" --job "$JOB" --height "${{ inputs.output_height }}" --work /mnt/work
